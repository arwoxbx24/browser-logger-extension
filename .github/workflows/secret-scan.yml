name: secret-scan

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - feature/bootstrap

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run redacted gitleaks scan
        run: |
          docker run --rm             -v "$PWD:/repo"             zricethezav/gitleaks:v8.21.2             dir /repo             --config /repo/.gitleaks.toml             --redact=100             --report-format json             --report-path /repo/gitleaks-redacted.json             --exit-code 1
